<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#fbfbfa; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6; --line:#e8e8ea; --hover:#f2f2f3;
  --accent:#d93a2b; --accent-soft:rgba(217,58,43,.08); --site:#1d1d1f;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1360px;margin:0 auto;padding:0 48px}
header{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{font-weight:600;letter-spacing:-.01em}
.seg{display:inline-flex;background:#efeff0;border-radius:9px;padding:2px}
.seg button{padding:5px 16px;border-radius:7px;color:var(--ink-2);font-size:13px;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.right{display:flex;align-items:center;gap:20px;font-size:13px;color:var(--ink-2)}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#34c759;margin-right:8px;vertical-align:1px}
.menu{position:relative}
.menu>button{padding:4px 8px;border-radius:6px;letter-spacing:2px;color:var(--ink-2)}
.menu>button:hover{background:var(--hover)}
.menu ul{position:absolute;right:0;top:34px;list-style:none;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;min-width:170px;display:none;z-index:1000}
.menu.open ul{display:block}
.menu li button{width:100%;text-align:left;padding:8px 12px;border-radius:6px;display:flex;justify-content:space-between;color:var(--ink)}
.menu li button:hover{background:var(--hover)}
.menu li kbd{font:inherit;color:var(--ink-3)}

.hero{padding:56px 0 48px}
.hero .big{font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.hero .sub{font-size:19px;color:var(--ink-2);margin-top:10px}

.stage{display:grid;grid-template-columns:380px 1fr;gap:56px;padding-bottom:64px}
.list{list-style:none}
.item{display:block;width:100%;text-align:left;padding:20px 0 20px 16px;border-top:1px solid var(--line);position:relative}
.item::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:2px;border-radius:2px;background:transparent}
.item[aria-selected=true]::before{background:var(--accent)}
.item:hover .name{color:#000}
.item .name{font-size:19px;font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:12px}
.item .name .amt{font-weight:500;font-variant-numeric:tabular-nums}
.item .act{color:var(--ink-2);margin-top:2px}
.item.red .act{color:var(--accent)}
.item:not([aria-selected=true]){opacity:.62}
.item:not([aria-selected=true]):hover{opacity:1}
.quiet{border-top:1px solid var(--line);padding:18px 0 0 16px;color:var(--ink-3);font-size:13px}
.quiet button{color:var(--ink-3)}
.quiet button:hover{color:var(--ink-2)}
.quiet ul{list-style:none;margin-top:10px}
.quiet li{padding:4px 0}

.detail h2{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.detail .action{font-size:19px;margin-top:6px;color:var(--ink-2)}
.detail .action.red{color:var(--accent)}
#map{height:440px;border-radius:14px;margin:28px 0 32px;background:#ececec;overflow:hidden}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.fact .k{font-size:13px;color:var(--ink-2)}
.fact .v{font-size:19px;font-weight:500;margin-top:2px;letter-spacing:-.01em}
.ev{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color .15s}
.ev:hover,.ev.on{text-decoration-color:var(--ink-3)}
.quote{margin-top:10px;padding-left:14px;border-left:2px solid var(--line);color:var(--ink-2);font-size:13px;display:none}
.quote.on{display:block}
.quote a{color:var(--ink-3);text-decoration:none;display:block;margin-top:4px}
.quote a:hover{color:var(--ink-2)}
.brief{list-style:none;margin-top:40px;max-width:760px}
.brief li{padding:12px 0;border-top:1px solid var(--line)}
.more{margin-top:12px;color:var(--ink-2);font-size:13px}
.more:hover{color:var(--ink)}
footer{padding:24px 0 40px;color:var(--ink-3);font-size:13px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.18);display:none;z-index:2000}
.sheet.on{display:flex;justify-content:flex-end}
.sheet .panel{background:#fff;width:min(560px,100%);height:100%;overflow:auto;padding:40px}
.sheet h3{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:24px;display:flex;justify-content:space-between}
.sheet h3 button{color:var(--ink-3);font-size:15px;font-weight:400}
.rows{list-style:none}
.rows li{padding:12px 0;border-top:1px solid var(--line)}
.rows .t{color:var(--ink-3);font-size:13px}
.leaflet-container{font-family:var(--sans)}
.leaflet-tooltip.evlabel{background:none;border:0;box-shadow:none;font-weight:600}
.leaflet-tooltip.evlabel::before{display:none}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:48px}}
@media (max-width:640px){.wrap{padding:0 16px}header{flex-wrap:wrap;height:auto;gap:12px;padding:16px 0}.seg button{padding:5px 10px}#map{height:300px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Sentinel</div>
    <div class="seg" id="lens" role="group" aria-label="Lens"></div>
    <div class="right">
      <span class="live" id="live">Live</span>
      <div class="menu" id="menu">
        <button aria-label="More" aria-haspopup="true" id="menuBtn">•••</button>
        <ul>
          <li><button data-open="route">Route <kbd>R</kbd></button></li>
          <li><button data-open="trace">Trace <kbd>T</kbd></button></li>
          <li><button data-open="runs">Run log</button></li>
          <li><button data-open="backtest">Backtest <kbd>B</kbd></button></li>
        </ul>
      </div>
    </div>
  </header>
  <section class="hero"><div class="big" id="heroBig">&nbsp;</div><div class="sub" id="heroSub">&nbsp;</div></section>
  <section class="stage">
    <div><ul class="list" id="list"></ul><div class="quiet" id="quiet"></div></div>
    <div class="detail" id="detail"></div>
  </section>
  <footer id="foot">Synthetic demo book · not real policies</footer>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const arr = x => Array.isArray(x) ? x : [];
const obj = x => x && typeof x === "object" ? x : {};
const num = x => { const n = +x; return isFinite(n) ? n : 0; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => { v = num(v); if(v >= 1e9) return "$" + (v/1e9).toFixed(2).replace(/\.?0+$/,"") + "B"; if(v >= 1e6) return "$" + Math.round(v/1e6) + "M"; if(v >= 1e3) return "$" + Math.round(v/1e3) + "K"; return "$" + v; };
const fmtN = v => num(v).toLocaleString("en-US");
const host = u => { try{ return u.startsWith("portfolio:") ? "Synthetic book" : new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } };

const ex = a => obj(a.exposure);
const lives = a => num(obj(ex(a).insured_lives).total) || arr(ex(a).by_line).reduce((s,l) => s + num(l.lives), 0);
const tiv = a => num(ex(a).tiv_usd);
const pd = a => num(ex(a).pd_tiv_usd) || tiv(a);
const exposed = a => tiv(a) > 0 || lives(a) > 0;
const tier = a => String(a.tier || "").toUpperCase();

const LENSES = [
  {k:"property", label:"Property", brief:"insurance", val:tiv, fmt:money, unit:"at stake", sort:(x,y) => tiv(y) - tiv(x)},
  {k:"claims", label:"Claims", brief:"insurance", val:pd, fmt:money, unit:"property damage exposure", sort:(x,y) => num(y.risk_score) - num(x.risk_score)},
  {k:"ah", label:"A&H", brief:"health", val:lives, fmt:v => fmtN(v), unit:"insured lives exposed", sort:(x,y) => lives(y) - lives(x)},
  {k:"cio", label:"CIO", brief:"wealth", val:tiv, fmt:money, unit:"of the book in harm's way", sort:(x,y) => tiv(y) - tiv(x)},
];
const params = new URLSearchParams(location.search);
const S = {data:null, runs:[], events:[], bt:null, sel:null, lens:"property", mon:false, more:false, map:null, hash:""};
if(LENSES.find(l => l.k === params.get("lens"))) S.lens = params.get("lens");
const lens = () => LENSES.find(l => l.k === S.lens);

async function fetchText(p){ const r = await fetch(p + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.text(); }
async function load(file, parse){ for(const p of ["./data/"+file, "./fixtures/"+file]){ try{ return parse(await fetchText(p)); }catch(e){} } return null; }
const pJSON = t => JSON.parse(t);
const pJSONL = t => t.split(/\r?\n/).map(l => { try{ return l.trim() ? JSON.parse(l) : null; }catch(e){ return null; } }).filter(Boolean);

const alerts = () => arr(obj(S.data).alerts).filter(x => x && typeof x === "object");
const decisions = () => alerts().filter(exposed).sort((x,y) => lens().sort(x,y) || num(y.risk_score) - num(x.risk_score));
const monitored = () => alerts().filter(a => !exposed(a));

const shortName = a => String(a.name || a.event_id).split(" - ")[0].replace(/\s*\(.*?\)/g, "");
const place = a => {
  const g = obj(a.geo); const suf = String(a.name || "").split(" - ")[1];
  const regs = [...new Set(arr(g.regions).map(r => String(r).replace(/\s*\(.*\)/, "")).filter(r => !/pacific|atlantic|ocean|sea\b|bay\b|gulf/i.test(r)))];
  if(regs.length === 1) return regs[0];
  return suf ? suf.split(",").pop().trim() : (arr(g.countries)[0] || "");
};
function action(a){
  const s = String(obj(obj(a.briefs).insurance).accumulation_action || "");
  const lvl = s.split(/[.—-]/)[0].trim().toUpperCase();
  let v = "Monitor";
  if(lvl === "ELEVATED" || lvl === "HIGH" || lvl === "SEVERE") v = /travel|a&h/i.test(s) ? "Restrict new Travel/A&H" : "Restrict new binding";
  else if(lvl === "MONITOR") v = "Run accumulation check";
  return {text: v + " · " + place(a), urgent: v.startsWith("Restrict")};
}
const scaleShort = s => String(s || "").split("_")[0];

function sevFact(a){
  const s = obj(a.issued_severity); const src = arr(a.sources).find(x => x.url === s.source_url && x.quote) || arr(a.sources).find(x => x.quote);
  let v = String(s.value || tier(a)).replace(/\s*\(.*?\)/, "").replace(/^Risk\s+/i, "");
  v = v.charAt(0).toUpperCase() + v.slice(1);
  return {k:"Severity", v: v + (s.scale ? " · " + scaleShort(s.scale) : ""), q: src ? src.quote : "", u: s.source_url || (src && src.url)};
}
function expFact(a){
  const e = ex(a); const r = arr(a.score_breakdown).find(x => /exposure/i.test(x.factor));
  const v = S.lens === "ah" ? fmtN(lives(a)) + " lives" : money(S.lens === "claims" ? pd(a) : tiv(a)) + " · " + fmtN(e.policies) + " sites";
  return {k:"Exposure", v, q: r ? r.reason : "", u: "portfolio://synthetic"};
}
function timeFact(a){
  const t = String(a.time_horizon || "—"); const src = arr(a.sources).find(x => x.verified && x.quote);
  return {k:"Timing", v: t.replace(/\s*\(.*\)/, ""), q: t.match(/\((.*)\)/) ? t.match(/\((.*)\)/)[1] : (src ? src.quote : ""), u: obj(a.issued_severity).source_url || ""};
}
function confFact(a){ const c = String(a.confidence || "—"); return {k:"Confidence", v: c.charAt(0).toUpperCase() + c.slice(1), q: a.confidence_rationale || "", u: ""}; }

function quoteHTML(q, u){ return `<div class="quote">${q ? "“" + esc(q) + "”" : "No quote on record."}${u ? `<a href="${esc(u.startsWith("portfolio:") ? "#" : u)}" target="_blank" rel="noopener">${esc(host(u))}</a>` : ""}</div>`; }

function renderLens(){
  $("#lens").innerHTML = LENSES.map((l,i) => `<button data-k="${l.k}" aria-pressed="${l.k === S.lens}" title="${i+1}">${l.label}</button>`).join("");
}
function renderHero(){
  const d = decisions(); const L = lens(); const total = d.reduce((s,a) => s + L.val(a), 0);
  $("#heroBig").textContent = L.fmt(total);
  $("#heroSub").textContent = L.unit + " · " + d.length + (d.length === 1 ? " decision" : " decisions");
}
function renderList(){
  const d = decisions(); const L = lens();
  $("#list").innerHTML = d.map(a => { const ac = action(a); return `<li><button class="item ${ac.urgent ? "red" : ""}" data-id="${esc(a.event_id)}" aria-selected="${a.event_id === S.sel}">
    <div class="name"><span>${esc(shortName(a))}</span><span class="amt">${esc(L.fmt(L.val(a)))}</span></div>
    <div class="act">${esc(ac.text)}</div></button></li>`; }).join("");
  const m = monitored();
  $("#quiet").innerHTML = m.length ? `<button id="monBtn" aria-expanded="${S.mon}">${m.length} events monitored, no exposure</button>${S.mon ? `<ul>${m.map(a => `<li>${esc(shortName(a))} · ${esc(place(a))}</li>`).join("")}</ul>` : ""}` : "";
}
function renderDetail(){
  const a = alerts().find(x => x.event_id === S.sel);
  if(!a){ $("#detail").innerHTML = ""; return; }
  const ac = action(a); const facts = [sevFact(a), expFact(a), timeFact(a), confFact(a)];
  const bullets = arr(obj(obj(a.briefs)[lens().brief]).bullets).filter(b => b && b.text && !/^accumulation action/i.test(b.text));
  const shown = S.more ? bullets : bullets.slice(0, 3);
  $("#detail").innerHTML = `<h2>${esc(shortName(a))}</h2>
    <div class="action ${ac.urgent ? "red" : ""}">${esc(ac.text)}</div>
    <div id="map"></div>
    <div class="facts">${facts.map(f => `<div class="fact"><div class="k">${f.k}</div><div class="v"><span class="ev" tabindex="0">${esc(f.v)}</span></div>${quoteHTML(f.q, f.u)}</div>`).join("")}</div>
    <ul class="brief">${shown.map(b => `<li><span class="ev" tabindex="0">${esc(b.text)}</span>${quoteHTML(b.quote, b.source_url)}</li>`).join("")}</ul>
    ${bullets.length > 3 ? `<button class="more" id="more">${S.more ? "Less" : (bullets.length - 3) + " more"}</button>` : ""}`;
  renderMap(a);
}

function hav(a,b){ const R = 6371, r = Math.PI/180; const dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.min(1, Math.sqrt(h))); }
function eventPath(a){ const g = obj(a.geo); const p0 = [num(g.lat), num(g.lon)];
  const t = arr(g.track).filter(p => Array.isArray(p) && isFinite(+p[0]) && isFinite(+p[1])).map(p => [+p[0], +p[1]]);
  if(!t.length) return [p0]; return hav(p0, t[0]) > 5 ? [p0, ...t] : t; }
function renderMap(a){
  const el = $("#map"); if(!el) return;
  if(S.map){ try{ S.map.remove(); }catch(e){} S.map = null; }
  if(!window.L) return;
  const g = obj(a.geo); const lat = num(g.lat), lon = num(g.lon), rkm = num(g.radius_km) || 100;
  const e = ex(a); const ic = obj(e.inner_core); const coreKm = num(ic.radius_km || g.core_radius_km);
  const path = eventPath(a); const areas = arr(g.areas).filter(x => x && isFinite(+x.lat) && isFinite(+x.lon) && x.lat !== null);
  const locs = arr(e.top_locations).filter(l => l && isFinite(+l.lat) && isFinite(+l.lon));
  const maxT = Math.max(1, ...locs.map(l => num(l.tiv_usd)));
  const tc = tier(a) === "RED" ? "#d93a2b" : "#8e8e93", ink = "#1d1d1f";
  try{
    const m = L.map(el, {zoomControl:false, attributionControl:true, fadeAnimation:false, zoomAnimation:false, markerZoomAnimation:false, scrollWheelZoom:false, worldCopyJump:true});
    L.control.zoom({position:"bottomright"}).addTo(m);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {maxZoom:16, attribution:"Esri"}).addTo(m);
    let bounds = L.latLng(lat, lon).toBounds(rkm*2000);
    if(path.length > 1){
      const midLat = path.reduce((s,p) => s + p[0], 0)/path.length;
      const band = L.polyline(path, {color:tc, opacity:.12, weight:10, lineCap:"round", lineJoin:"round", interactive:false}).addTo(m);
      const sizeBand = () => { const mpp = 40075016.686*Math.cos(midLat*Math.PI/180)/Math.pow(2, m.getZoom()+8); band.setStyle({weight:Math.max(4, 2*rkm*1000/mpp)}); };
      m.on("zoomend", sizeBand); m.whenReady(sizeBand);
      L.polyline(path, {color:ink, weight:1.5, opacity:.7, dashArray:"5 5", interactive:false}).addTo(m);
      path.forEach(p => bounds.extend(p));
    } else if(areas.length){
      areas.forEach(ar => { const r = num(ar.radius_km) || rkm;
        L.circle([+ar.lat, +ar.lon], {radius:r*1000, color:tc, weight:1, fillColor:tc, fillOpacity:.07}).addTo(m).bindTooltip(esc(ar.name));
        bounds.extend(L.latLng(+ar.lat, +ar.lon).toBounds(r*2000)); });
    } else L.circle([lat, lon], {radius:rkm*1000, color:tc, weight:1, fillColor:tc, fillOpacity:.08}).addTo(m);
    if(coreKm > 0) L.circle([lat, lon], {radius:coreKm*1000, color:tc, weight:0, fillColor:tc, fillOpacity:.25}).addTo(m);
    locs.forEach(l => L.circleMarker([+l.lat, +l.lon], {radius:4 + 10*Math.sqrt(num(l.tiv_usd)/maxT), color:ink, weight:1, fillColor:ink, fillOpacity:.25}).addTo(m)
      .bindTooltip(`<b>${esc(l.name)}</b><br>${money(l.tiv_usd)}`));
    L.circleMarker([lat, lon], {radius:6, color:"#fff", weight:2, fillColor:tc, fillOpacity:1}).addTo(m);
    locs.slice(0, 8).forEach(l => bounds.extend([+l.lat, +l.lon]));
    m.fitBounds(bounds.pad(0.08), {animate:false}); S.map = m;
    setTimeout(() => { if(S.map !== m) return; m.invalidateSize(); m.fitBounds(bounds.pad(0.08), {animate:false}); }, 60);
  }catch(err){ console.warn("map", err); }
}

function ago(ts){ const s = Math.max(0, (Date.now() - Date.parse(ts))/1000); if(!isFinite(s)) return ""; if(s < 90) return "just now"; if(s < 5400) return Math.round(s/60) + " min ago"; if(s < 172800) return Math.round(s/3600) + " h ago"; return Math.round(s/86400) + " d ago"; }
function renderLive(){ const ts = obj(S.data).generated_at; $("#live").textContent = ts ? "Live · updated " + ago(ts) : "Live"; }
function renderAll(){ renderLens(); renderHero(); renderList(); renderDetail(); renderLive(); }

async function loadAll(){
  const [a, e, r, b] = await Promise.all([load("alerts.json", pJSON), load("events.jsonl", pJSONL), load("runs.jsonl", pJSONL), load("backtest.json", pJSON)]);
  S.events = arr(e); S.runs = arr(r); S.bt = b ? obj(b) : null;
  if(a){ S.data = Array.isArray(a) ? {alerts:a} : obj(a);
    const h = JSON.stringify(S.data.alerts);
    const want = params.get("event");
    if(!S.sel && want && alerts().find(x => x.event_id === want)) S.sel = want;
    if(!S.sel || !decisions().find(x => x.event_id === S.sel)) S.sel = (decisions()[0] || {}).event_id || null;
    if(h !== S.hash){ S.hash = h; renderAll(); } else renderLive();
  }
}

/* sheets */
function openSheet(kind){
  const a = alerts().find(x => x.event_id === S.sel) || {};
  let title = "", body = "";
  if(kind === "route"){ title = "Route";
    body = `<ul class="rows">${["Accumulation manager","Chief Underwriting Officer","Claims","Travel & A&H"].map(p => `<li>${p}<div class="t">${esc(shortName(a))} · ${esc(action(a).text)}</div></li>`).join("")}</ul>`;
  } else if(kind === "trace"){ title = "Trace";
    const ev = S.events.filter(x => x.event_id === a.event_id).slice(-20).reverse();
    body = `<ul class="rows">${ev.map(x => `<li>${esc(x.agent)}<div class="t">${esc(x.summary || "")}</div><div class="t">${esc(ago(x.ts))}</div></li>`).join("") || "<li>No steps recorded.</li>"}</ul>`;
  } else if(kind === "runs"){ title = "Run log";
    body = `<ul class="rows">${S.runs.slice(-15).reverse().map(x => `<li>${esc(ago(x.ts))}<div class="t">${fmtN(x.items_fetched)} items · ${fmtN(x.alerts)} alerts · ${num(x.duration_s)} s</div></li>`).join("") || "<li>No runs.</li>"}</ul>`;
  } else if(kind === "backtest"){ title = "Backtest";
    const b = obj(S.bt);
    body = b.event ? `<div style="font-size:48px;font-weight:600;letter-spacing:-.03em">${num(b.lead_time_hours)} h</div><div style="color:var(--ink-2);margin-bottom:24px">earlier than the first headline · ${esc(String(b.event).split(" - ")[0])}</div>
      <ul class="rows">${arr(b.timeline).map(t => `<li>${esc(String(t.kind || "").replace(/_/g," "))}<div class="t">${esc(t.source || "")} · ${esc(String(t.ts || "").slice(0,16).replace("T"," "))}</div></li>`).join("")}</ul>` : "No backtest.";
  }
  $("#panel").innerHTML = `<h3>${title}<button id="close" aria-label="Close">Done</button></h3>${body}`;
  $("#sheet").classList.add("on"); $("#menu").classList.remove("open");
}
const closeSheet = () => $("#sheet").classList.remove("on");

document.addEventListener("click", e => {
  const t = e.target;
  const lb = t.closest("#lens button"); if(lb){ S.lens = lb.dataset.k; S.more = false; renderAll(); return; }
  const it = t.closest(".item"); if(it){ S.sel = it.dataset.id; S.more = false; renderList(); renderDetail(); return; }
  if(t.closest("#monBtn")){ S.mon = !S.mon; renderList(); return; }
  if(t.closest("#more")){ S.more = !S.more; renderDetail(); return; }
  const ev = t.closest(".ev"); if(ev){ const q = ev.parentElement.parentElement.querySelector(".quote") || ev.parentElement.querySelector(".quote");
    const host = ev.closest(".fact, li"); const qq = host && host.querySelector(".quote"); if(qq){ qq.classList.toggle("on"); ev.classList.toggle("on"); } return; }
  if(t.closest("#menuBtn")){ $("#menu").classList.toggle("open"); return; }
  const o = t.closest("[data-open]"); if(o){ openSheet(o.dataset.open); return; }
  if(t.closest("#close") || t === $("#sheet")){ closeSheet(); return; }
  if(!t.closest("#menu")) $("#menu").classList.remove("open");
});
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("input,textarea")) return;
  if(e.key === "Enter" && e.target.classList && e.target.classList.contains("ev")){ e.target.click(); return; }
  const k = e.key;
  if(k === "Escape"){ closeSheet(); $("#menu").classList.remove("open"); return; }
  if(k === "ArrowDown" || k === "ArrowUp"){ const d = decisions(); if(!d.length) return; e.preventDefault();
    let i = d.findIndex(x => x.event_id === S.sel); i = Math.max(0, Math.min(d.length-1, i + (k === "ArrowDown" ? 1 : -1)));
    S.sel = d[i].event_id; S.more = false; renderList(); renderDetail(); return; }
  if(/^[1-4]$/.test(k)){ S.lens = LENSES[+k-1].k; renderAll(); return; }
  if(k === "r" || k === "R") openSheet("route");
  if(k === "b" || k === "B") openSheet("backtest");
  if(k === "t" || k === "T") openSheet("trace");
});
loadAll(); setInterval(loadAll, 30000); setInterval(renderLive, 30000);
</script>
</body>
