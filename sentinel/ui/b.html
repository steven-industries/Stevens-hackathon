<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#1d1d1f; --mute:#6e6e73; --faint:#a1a1a6; --line:rgba(0,0,0,.08); --fill:rgba(0,0,0,.045);
  --card:rgba(255,255,255,.94); --red:#d70015; --amber:#c93400; --watch:#8e8e93; --site:#1d1d1f;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9e9ea;color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
#map{position:fixed;inset:0;background:#e9e9ea}
.leaflet-tile-pane{filter:saturate(0) contrast(.96)}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.6)!important;color:var(--faint)}
.leaflet-control-zoom{border:0!important;box-shadow:0 2px 12px rgba(0,0,0,.08)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-tooltip.lbl{background:none;border:0;box-shadow:none;font:600 13px var(--f);color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip{font:13px var(--f);border-radius:8px;border:0;box-shadow:0 4px 16px rgba(0,0,0,.12)}

.panel{position:fixed;top:20px;left:20px;bottom:20px;width:400px;display:flex;flex-direction:column;
  background:var(--card);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06);z-index:500;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:22px 28px 0}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.live{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.live i{width:6px;height:6px;border-radius:50%;background:#34c759}
.live.stale i{background:var(--faint)}
.menu-b{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.menu-b:hover,.menu-b[aria-expanded=true]{background:var(--fill);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 28px 0;padding:2px;background:var(--fill);border-radius:9px}
.seg button{font-size:13px;font-weight:500;padding:6px 0;border-radius:7px;color:var(--mute)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.body{flex:1;overflow:auto;padding:8px 16px 16px}
.foot{padding:0 28px 18px;font-size:12px;color:var(--faint)}

.item{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;text-align:left;padding:16px 12px;border-radius:14px;align-items:center}
.item+.item{box-shadow:0 -1px 0 var(--line)}
.item:hover{background:var(--fill)}
.item:hover+.item,.item.on+.item{box-shadow:none}
.item.on{background:var(--fill)}
.item .n{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.item .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tc)}
.item .a{grid-column:1;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:16px}
.item .v{grid-row:1/3;grid-column:2;font-size:22px;font-weight:600;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums}
.item .v small{display:block;font-size:12px;font-weight:400;color:var(--faint);letter-spacing:0}
.quiet{padding:14px 12px 4px;font-size:13px;color:var(--faint)}

.back{font-size:15px;color:var(--mute);padding:10px 12px 0;display:flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.d{padding:12px 12px 8px}
.d h1{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
.act{margin-top:10px;display:flex;gap:8px;font-size:15px;color:var(--ink)}
.act .dot{margin-top:7px}
.big{margin-top:24px;font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{margin:2px 0 0;font-size:15px;font-weight:500}
.facts dd.sev{color:var(--tc)}
.says{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.say{display:block;width:100%;text-align:left;padding:10px 0;font-size:15px;line-height:1.5}
.say:hover .t{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.q{display:none;margin:0 0 10px;padding:12px 14px;background:var(--fill);border-radius:12px;font-size:14px}
.q.on{display:block}
.q blockquote{margin:0;font-style:italic}
.q .src{margin-top:8px;font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.q .src a{text-decoration:none;font-weight:500;color:var(--ink)}
.q .src a:hover{text-decoration:underline}
.ok{color:#248a3d}

.pop{position:absolute;top:58px;right:20px;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.08);padding:6px;min-width:210px;display:none;z-index:5}
.pop.on{display:block}
.pop button{display:flex;justify-content:space-between;width:100%;padding:9px 12px;border-radius:9px;font-size:14px}
.pop button:hover{background:var(--fill)}
.pop kbd{font:12px var(--f);color:var(--faint)}

.sheet{position:fixed;top:20px;right:20px;bottom:20px;width:min(520px,calc(100vw - 40px));background:#fff;border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.16);z-index:600;transform:translateX(calc(100% + 40px));transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:center;padding:22px 28px 10px}
.sheet h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet header button{margin-left:auto;font-size:15px;color:var(--mute)}
.sheet .sb{overflow:auto;padding:4px 28px 28px;font-size:14px}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row .h{display:flex;gap:10px;font-weight:600}
.row .h span{color:var(--mute);font-weight:400;margin-left:auto;font-size:13px}
.row p{margin:4px 0 0;color:var(--mute)}
.lead{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1}
.lead small{font-size:22px}
.m{color:var(--mute)}
@media (max-width:760px){
  .panel{top:auto;left:12px;right:12px;bottom:12px;width:auto;height:58vh}
  .top,.foot{padding-left:20px;padding-right:20px}.seg{margin-left:20px;margin-right:20px}
}
</style>
</head>
<body>
<div id="map" aria-label="Map of events touching our book"></div>

<aside class="panel" aria-label="Decisions">
  <div class="top">
    <span class="brand">Sentinel</span>
    <span class="live" id="live"><i></i><span>Loading</span></span>
    <button class="menu-b" id="menuB" aria-label="More" aria-expanded="false" aria-haspopup="menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="14" cy="9" r="1.6"/></svg>
    </button>
    <div class="pop" id="pop" role="menu">
      <button role="menuitem" data-act="route">Route &amp; notify <kbd>R</kbd></button>
      <button role="menuitem" data-act="trace">Run log <kbd>T</kbd></button>
      <button role="menuitem" data-act="bt">Backtest <kbd>B</kbd></button>
    </div>
  </div>
  <div class="seg" id="seg" role="group" aria-label="Lens"></div>
  <div class="body" id="body"></div>
  <div class="foot">Synthetic demo book</div>
</aside>

<section class="sheet" id="sheet" aria-hidden="true">
  <header><h2 id="shT"></h2><button id="shX">Done</button></header>
  <div class="sb" id="shB"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const arr = x => Array.isArray(x) ? x : [];
const obj = x => (x && typeof x === "object" && !Array.isArray(x)) ? x : {};
const str = x => (x === null || x === undefined) ? "" : String(x);
const esc = x => str(x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = x => { const n = Number(x); return isFinite(n) ? n : 0; };
function money(v){ v = num(v); if(v >= 1e9) return "$" + (v/1e9).toFixed(2).replace(/\.?0+$/,"") + "B";
  if(v >= 1e6) return "$" + Math.round(v/1e6) + "M"; if(v >= 1e3) return "$" + Math.round(v/1e3) + "K"; return "$" + Math.round(v); }
const fmtN = v => num(v).toLocaleString("en-US");
const pdate = s => { if(!s) return null; const d = new Date(s); return isNaN(d) ? null : d; };
function et(s){ const d = pdate(s); if(!d) return "–"; return d.toLocaleString("en-US", {timeZone:"America/New_York", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}).replace(",", ""); }
function ago(s){ const d = pdate(s); if(!d) return ""; const m = Math.round((Date.now() - d)/60000);
  if(m < 1) return "just now"; if(m < 60) return m + " min ago"; const h = Math.floor(m/60); if(h < 48) return h + " h ago"; return Math.round(h/24) + " d ago"; }

/* ---- domain ---- */
const tierOf = a => { const t = str(a.tier).toUpperCase(); return ["RED","AMBER","WATCH"].includes(t) ? t : (a.status === "alert" ? "AMBER" : "WATCH"); };
const tcol = a => ({RED:"var(--red)", AMBER:"var(--amber)", WATCH:"var(--watch)"})[tierOf(a)];
const tcolHex = a => ({RED:"#d70015", AMBER:"#c93400", WATCH:"#8e8e93"})[tierOf(a)];
const ex = a => obj(a.exposure);
function lives(a){ const e = ex(a); const il = obj(e.insured_lives);
  if(num(il.total) > 0) return {total:num(il.total), travel:num(il.travel), ah:num(il.ah)};
  const bl = arr(e.by_line); const t = bl.filter(l => /travel/i.test(l.line)).reduce((s,l)=>s+num(l.lives),0), h = bl.filter(l => /accident|health|a&h/i.test(l.line)).reduce((s,l)=>s+num(l.lives),0);
  return {total:num(e.insured_travelers) || t + h, travel:t, ah:h}; }
const tiv = a => num(ex(a).tiv_usd);
const sites = a => num(ex(a).policies);
const core = a => { const c = obj(ex(a).inner_core); return {has:c.radius_km !== undefined || c.policies !== undefined, n:num(c.policies), tiv:num(c.tiv_usd), km:num(c.radius_km)}; };
const touches = a => tierOf(a) !== "WATCH" && (tiv(a) > 0 || lives(a).total > 0);
const AUTH = {NHC_SSHWS:"NHC", USGS_PAGER:"USGS", GDACS:"GDACS", WHO_DON:"WHO", WHO_GRADE:"WHO", JMA:"JMA"};
function sevShort(a){ const s = obj(a.issued_severity); if(!s.value) return "–";
  const v = str(s.value).replace(/\s*\(.*?\)\s*/g, " ").trim(); return v + " · " + (AUTH[str(s.scale).toUpperCase()] || str(s.scale)); }
function action(a){ const ins = obj(obj(a.briefs).insurance); let s = str(ins.accumulation_action).trim();
  if(!s) s = str(ins.reserving_posture) || str(ins.headline);
  s = s.replace(/^[A-Z][A-Z \/]+?\s*[—–:-]\s*/, ""); s = s.split(/[;.](\s|$)/)[0];
  return s.charAt(0).toUpperCase() + s.slice(1); }
const timing = a => str(a.time_horizon).replace(/\s*\(.*\)\s*/, "").trim() || "–";
const firstSentence = t => { t = str(t).trim().replace(/\b(incl|e\.g|i\.e|approx|vs)\./gi, "$1\u2024");
  t = t.split(/;\s|\s[—–]\s|(?<=[.!?])\s/)[0].replace(/[,:]$/, "").replace(/\u2024/g, ".");
  if(t.length > 150){ t = t.slice(0, 150).replace(/\s+\S*$/, "") + "…"; } else if(!/[.!?…]$/.test(t)) t += ".";
  return t; };

const LENSES = [
  {k:"cuo", name:"Property", brief:"insurance", persona:/CUO|Accumulation|Cat Model/i, sort:(a,b) => tiv(b) - tiv(a),
   big:a => ({v:money(tiv(a)), u:"insured value"}), size:a => tiv(a),
   exp:a => `${fmtN(sites(a))} sites`},
  {k:"claims", name:"Claims", brief:"insurance", persona:/Claims/i, sort:(a,b) => (core(b).n - core(a).n) || (sites(b) - sites(a)),
   big:a => { const c = core(a); return c.has ? {v:fmtN(c.n), u:c.n === 1 ? "site in core" : "sites in core"} : {v:fmtN(sites(a)), u:"sites nearby"}; }, size:a => core(a).n || sites(a) * .3,
   exp:a => `${fmtN(sites(a))} sites · ${money(tiv(a))}`},
  {k:"ah", name:"A&H", brief:"health", persona:/A&H|Travel/i, sort:(a,b) => lives(b).total - lives(a).total,
   big:a => ({v:fmtN(lives(a).total), u:"insured lives"}), size:a => lives(a).total,
   exp:a => { const l = lives(a); return `${fmtN(l.travel)} travel · ${fmtN(l.ah)} A&H`; }},
  {k:"cio", name:"CIO", brief:"wealth", persona:/CIO/i, sort:(a,b) => num(b.risk_score) - num(a.risk_score),
   big:a => ({v:money(tiv(a)), u:"insured value"}), size:a => tiv(a),
   exp:a => `${arr(ex(a).by_line).filter(l => num(l.tiv_usd) > 0).length} lines`},
];

/* ---- state ---- */
const params = new URLSearchParams(location.search);
const POLL = Math.max(3, +params.get("poll") || 30) * 1000;
const S = {data:null, events:[], runs:[], bt:null, sel:null, lens:"cuo", hash:"", map:null, over:null, focus:null, sheet:null};
try{ const l = localStorage.getItem("sentinel.lens"); if(LENSES.find(x => x.k === l)) S.lens = l; }catch(e){}
if(LENSES.find(x => x.k === params.get("lens"))) S.lens = params.get("lens");
const lens = () => LENSES.find(x => x.k === S.lens);
const alerts = () => arr(obj(S.data).alerts);
const decisions = () => alerts().filter(touches).sort((x,y) => lens().sort(x,y) || num(y.risk_score) - num(x.risk_score));
const quiet = () => alerts().filter(a => !touches(a));
const cur = () => alerts().find(a => a.event_id === S.sel);

async function fetchText(p){ const r = await fetch(p + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.text(); }
async function load(file, parse){
  const tries = params.get("data") === "fixtures" ? ["./fixtures/"+file] : ["./data/"+file, "./fixtures/"+file];
  for(const p of tries){ try{ return parse(await fetchText(p)); }catch(e){} } return null; }
const pJSONL = t => t.split(/\r?\n/).map(l => { try{ return l.trim() ? JSON.parse(l) : null; }catch(e){ return null; } }).filter(Boolean);

async function loadAll(){
  const [a, e, r, b] = await Promise.all([load("alerts.json", JSON.parse), load("events.jsonl", pJSONL), load("runs.jsonl", pJSONL), load("backtest.json", JSON.parse)]);
  S.events = arr(e); S.runs = arr(r); S.bt = b ? obj(b) : null;
  if(a){ const d = Array.isArray(a) ? {alerts:a} : obj(a); d.alerts = arr(d.alerts).filter(x => x && typeof x === "object");
    const h = JSON.stringify(d.alerts); const changed = h !== S.hash; S.hash = h; S.data = d;
    if(S.sel && !cur()) S.sel = null;
    if(!S.sel && params.get("event") && alerts().find(x => x.event_id === params.get("event"))) S.sel = params.get("event");
    if(changed){ render(); drawOverview(); if(S.sel) focus(cur(), false); else fitAll(false); }
  } else if(!S.data){ $("#body").innerHTML = '<div class="quiet">No data yet.</div>'; }
  renderLive();
}

/* ---- panel ---- */
function renderLive(){ const ts = obj(S.data).generated_at || (S.runs[S.runs.length-1] || {}).ts;
  const d = pdate(ts); const stale = !d || Date.now() - d > 30*60000;
  $("#live").className = "live" + (stale ? " stale" : ""); $("#live span").textContent = d ? (stale ? "Updated " : "Live · ") + ago(ts) : "Offline"; }
function renderSeg(){ $("#seg").innerHTML = LENSES.map(l => `<button aria-pressed="${l.k === S.lens}" data-l="${l.k}">${esc(l.name)}</button>`).join("");
  $("#seg").querySelectorAll("button").forEach(b => b.onclick = () => setLens(b.dataset.l)); }
function render(){ renderSeg(); S.sel ? renderDetail() : renderList(); }
function renderList(){ const L = lens(); const ds = decisions(); const q = quiet().length;
  $("#body").innerHTML = ds.map(a => { const b = L.big(a); return `<button class="item" data-id="${esc(a.event_id)}" style="--tc:${tcol(a)}">
      <span class="n"><i class="dot"></i><span>${esc(a.name)}</span></span>
      <span class="v">${esc(b.v)}<small>${esc(b.u)}</small></span>
      <span class="a">${esc(action(a))}</span></button>`; }).join("")
    + (q ? `<div class="quiet">${q} monitored, no exposure</div>` : "")
    + (!ds.length && !q ? '<div class="quiet">Nothing touches the book.</div>' : "");
  $("#body").querySelectorAll(".item").forEach(b => { b.onclick = () => select(b.dataset.id);
    b.onmouseenter = () => hot(b.dataset.id, true); b.onmouseleave = () => hot(b.dataset.id, false); }); }
function says(a){ const L = lens(); const bl = arr(obj(obj(a.briefs)[L.brief]).bullets).filter(b => b && b.text && !/^\s*(Accumulation action|Reserving posture)/i.test(b.text));
  return bl.slice(0, 3); }
function renderDetail(){ const a = cur(); if(!a){ renderList(); return; } const L = lens(); const b = L.big(a);
  const conf = str(a.confidence); const bs = says(a);
  $("#body").innerHTML = `<button class="back" id="back"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2L2 8l6 6"/></svg>All</button>
  <div class="d" style="--tc:${tcol(a)}">
    <h1>${esc(a.name)}</h1>
    <div class="act"><i class="dot"></i><span>${esc(action(a))}</span></div>
    <div class="big">${esc(b.v)}<small>${esc(b.u)}</small></div>
    <dl class="facts">
      <div><dt>Severity</dt><dd class="sev">${esc(sevShort(a))}</dd></div>
      <div><dt>Exposure</dt><dd>${esc(L.exp(a))}</dd></div>
      <div><dt>Timing</dt><dd>${esc(timing(a))}</dd></div>
      <div><dt>Confidence</dt><dd>${esc(conf ? conf[0].toUpperCase() + conf.slice(1) : "–")}</dd></div>
    </dl>
    ${bs.length ? `<div class="says">${bs.map((x,i) => `<button class="say" data-i="${i}" aria-expanded="false"><span class="t">${esc(firstSentence(x.text))}</span></button>${quote(a, x, i)}`).join("")}</div>` : ""}
  </div>`;
  $("#back").onclick = () => select(null);
  $("#body").querySelectorAll(".say").forEach(btn => btn.onclick = () => { const q = $("#q" + btn.dataset.i); const on = !q.classList.contains("on");
    q.classList.toggle("on", on); btn.setAttribute("aria-expanded", on); }); }
function quote(a, b, i){ const pf = /^portfolio:/.test(str(b.source_url)); const s = arr(a.sources).find(x => x.url === b.source_url) || {};
  let pub = str(s.publisher); if(!pub){ try{ pub = new URL(b.source_url).hostname.replace(/^www\./,""); }catch(e){ pub = ""; } }
  const ver = b.verified !== undefined ? !!b.verified : !!s.verified;
  return `<div class="q" id="q${i}">${b.quote ? `<blockquote>“${esc(b.quote)}”</blockquote>` : '<span class="m">No quote attached.</span>'}
    <div class="src">${pf ? "Our book" : `<a href="${esc(b.source_url)}" target="_blank" rel="noopener">${esc(pub || "Source")}</a>`}${ver ? ' · <span class="ok">Verified</span>' : ' · Unverified'}</div></div>`; }

function select(id){ S.sel = id; closeSheet(); render(); $("#body").scrollTop = 0;
  if(id) focus(cur(), true); else { clearFocus(); drawOverview(); fitAll(true); } }
function setLens(k){ if(!LENSES.find(l => l.k === k)) return; S.lens = k; try{ localStorage.setItem("sentinel.lens", k); }catch(e){}
  render(); drawOverview(); if(S.sel) focus(cur(), false); }

/* ---- map ---- */
const padTL = () => innerWidth > 760 ? [460, 40] : [20, 20];
const padBR = () => innerWidth > 760 ? [60, 40] : [20, Math.round(innerHeight*.6)];
function initMap(){ if(!window.L) return;
  const m = L.map("map", {zoomControl:false, worldCopyJump:true, minZoom:2, zoomSnap:1}).setView([15, -30], 3);
  L.control.zoom({position:"bottomright"}).addTo(m);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {maxZoom:16, attribution:"Esri"}).addTo(m);
  S.map = m; S.over = L.layerGroup().addTo(m); S.focus = L.layerGroup().addTo(m); }
const mk = {};
function drawOverview(){ if(!S.map) return; S.over.clearLayers(); const L_ = lens(); const ds = decisions();
  const max = Math.max(1, ...ds.map(L_.size));
  ds.forEach(a => { const g = obj(a.geo); if(!isFinite(+g.lat) || !isFinite(+g.lon) || g.lat === null) return;
    const on = a.event_id === S.sel; const c = tcolHex(a);
    const r = 7 + 22*Math.sqrt(Math.max(0, L_.size(a))/max);
    const halo = L.circleMarker([+g.lat, +g.lon], {radius:r, stroke:false, fillColor:c, fillOpacity:on ? .12 : .18, interactive:false}).addTo(S.over);
    const m = L.circleMarker([+g.lat, +g.lon], {radius:on ? 7 : 5, color:"#fff", weight:2, fillColor:c, fillOpacity:1}).addTo(S.over);
    m.bindTooltip(esc(a.name), {permanent:on, direction:"right", offset:[10,0], className:on ? "lbl" : ""});
    m.on("click", () => select(a.event_id)); mk[a.event_id] = {halo, m, r}; }); }
function hot(id, on){ const k = mk[id]; if(!k) return; k.halo.setStyle({fillOpacity:on ? .32 : .18}); }
function fitAll(anim){ if(!S.map) return; const pts = decisions().map(a => obj(a.geo)).filter(g => isFinite(+g.lat) && g.lat !== null).map(g => [+g.lat, +g.lon]);
  if(!pts.length) return; S.map.flyToBounds(L.latLngBounds(pts), {paddingTopLeft:padTL(), paddingBottomRight:padBR(), maxZoom:4, animate:anim, duration:.9}); }
function clearFocus(){ S.focus && S.focus.clearLayers(); }
function validTrack(g){ return arr(obj(g).track).filter(p => Array.isArray(p) && p.length >= 2 && p[0] !== null && p[1] !== null && isFinite(+p[0]) && isFinite(+p[1])).map(p => [+p[0], +p[1]]); }
function focus(a, anim){ if(!S.map || !a) return; clearFocus(); drawOverview();
  const g = obj(a.geo); const lat = num(g.lat), lon = num(g.lon), rkm = num(g.radius_km) || 100; const c = tcolHex(a); const co = core(a);
  const t = validTrack(g); const path = t.length ? ([lat, lon] + "" === t[0] + "" ? t : [[lat, lon], ...t]) : [[lat, lon]];
  let bounds = L.latLng(lat, lon).toBounds(rkm*2000);
  const areas = arr(g.areas).filter(x => x && isFinite(+x.lat) && isFinite(+x.lon) && x.lat !== null);
  if(path.length > 1){
    L.polyline(path, {color:c, weight:2, opacity:.8, dashArray:"2 6", lineCap:"round", interactive:false}).addTo(S.focus);
    L.circle(path[0], {radius:rkm*1000, color:c, weight:1, opacity:.35, fillColor:c, fillOpacity:.05, interactive:false}).addTo(S.focus);
    path.forEach(p => bounds.extend(p));
  } else if(areas.length){
    areas.forEach(ar => { const r = num(ar.radius_km) || rkm; L.circle([+ar.lat, +ar.lon], {radius:r*1000, color:c, weight:1, opacity:.35, fillColor:c, fillOpacity:.025}).addTo(S.focus).bindTooltip(esc(ar.name));
      bounds.extend(L.latLng(+ar.lat, +ar.lon).toBounds(r*2000)); });
  } else L.circle([lat, lon], {radius:rkm*1000, color:c, weight:1, opacity:.35, fillColor:c, fillOpacity:.06, interactive:false}).addTo(S.focus);
  if(co.km > 0) L.circle([lat, lon], {radius:co.km*1000, stroke:false, fillColor:c, fillOpacity:.18, interactive:false}).addTo(S.focus);
  const locs = arr(ex(a).top_locations).filter(l => l && isFinite(+l.lat) && isFinite(+l.lon) && l.lat !== null);
  const maxT = Math.max(1, ...locs.map(l => num(l.tiv_usd)));
  locs.forEach(l => L.circleMarker([+l.lat, +l.lon], {radius:3 + 7*Math.sqrt(num(l.tiv_usd)/maxT), color:"#1d1d1f", weight:1, opacity:.7, fillColor:"#1d1d1f", fillOpacity:.15}).addTo(S.focus)
    .bindTooltip(`<b>${esc(l.name)}</b><br>${money(l.tiv_usd)}`));
  locs.slice(0, 8).forEach(l => bounds.extend([+l.lat, +l.lon]));
  S.map.flyToBounds(bounds, {paddingTopLeft:padTL(), paddingBottomRight:padBR(), maxZoom:8, animate:anim, duration:1.1}); }

/* ---- menu + sheet ---- */
function toggleMenu(on){ on = on === undefined ? !$("#pop").classList.contains("on") : on; $("#pop").classList.toggle("on", on); $("#menuB").setAttribute("aria-expanded", on); }
$("#menuB").onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener("click", e => { if(!e.target.closest("#pop")) toggleMenu(false); });
$("#pop").querySelectorAll("button").forEach(b => b.onclick = () => { toggleMenu(false); ({route:openRoute, trace:openTrace, bt:openBacktest})[b.dataset.act](); });
function openSheet(kind, title, html){ S.sheet = kind; $("#shT").textContent = title; $("#shB").innerHTML = html; $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden", "false"); }
function closeSheet(){ S.sheet = null; $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden", "true"); }
$("#shX").onclick = closeSheet;
function openRoute(){ const a = cur() || decisions()[0]; if(!a) return; const L_ = lens();
  const rt = arr(a.routing).slice().sort((x,y) => (L_.persona.test(str(y.persona)) - L_.persona.test(str(x.persona))) || str(x.priority).localeCompare(str(y.priority)));
  openSheet("route", "Notify · " + a.name, rt.length ? rt.map(r => `<div class="row"><div class="h">${esc(r.persona)}<span>${esc(r.priority || "")} · ${esc(r.channel || "")}</span></div><p>${esc(r.message || "")}</p></div>`).join("") : '<p class="m">Not routed yet.</p>'); }
function openTrace(){ const runs = S.runs.slice(-10).reverse(); const ev = S.events.filter(e => !S.sel || e.event_id === S.sel).slice(-40).reverse();
  openSheet("trace", "Run log", `${runs.map(x => `<div class="row"><div class="h">${esc(et(x.ts))}<span>${num(x.alerts)} alerts · ${num(x.duration_s)}s</span></div><p>${fmtN(x.items_fetched)} items · ${num(x.feeds_ok)} feeds · ${esc(x.mode || "")}</p></div>`).join("") || '<p class="m">No runs yet.</p>'}
    ${ev.length ? `<h2 style="font-size:15px;margin:24px 0 4px">Trace</h2>` + ev.map(e => `<div class="row"><div class="h">${esc(e.agent || "agent")}<span>${esc(et(e.ts))}</span></div><p>${esc(e.summary || "")}</p></div>`).join("") : ""}`); }
function openBacktest(){ const b = S.bt; if(!b){ openSheet("bt", "Backtest", '<p class="m">No backtest yet.</p>'); return; }
  const tl = arr(b.timeline).filter(x => pdate(x.ts)).sort((x,y) => pdate(x.ts) - pdate(y.ts));
  const K = {weak_signal:"Weak signal", authority:"Authority", sentinel_alert:"Sentinel", mainstream:"Headlines"};
  openSheet("bt", "Backtest", `<div class="lead">${num(b.lead_time_hours)}<small> h</small></div><p class="m" style="margin:6px 0 16px">ahead of headlines · ${esc(b.event || "")}</p>
    ${tl.map(x => `<div class="row"><div class="h">${esc(K[x.kind] || x.kind)}<span>${esc(et(x.ts))}</span></div><p>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</p></div>`).join("")}`); }

document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key;
  if(k === "Escape"){ if(S.sheet || $("#pop").classList.contains("on")){ closeSheet(); toggleMenu(false); } else if(S.sel) select(null); return; }
  const o = decisions(); const i = o.findIndex(a => a.event_id === S.sel);
  if(k === "ArrowDown" || k === "j"){ e.preventDefault(); const n = o[i+1] || o[i]; if(n) select(n.event_id); }
  else if(k === "ArrowUp" || k === "k"){ e.preventDefault(); if(i > 0) select(o[i-1].event_id); }
  else if(/^[1-4]$/.test(k)) setLens(LENSES[+k - 1].k);
  else if(/^[rR]$/.test(k)) S.sheet === "route" ? closeSheet() : openRoute();
  else if(/^[tT]$/.test(k)) S.sheet === "trace" ? closeSheet() : openTrace();
  else if(/^[bB]$/.test(k)) S.sheet === "bt" ? closeSheet() : openBacktest();
});
addEventListener("resize", () => S.map && S.map.invalidateSize());

initMap(); renderSeg();
loadAll().catch(err => { console.error(err); $("#body").innerHTML = '<div class="quiet">Could not load data.</div>'; });
setInterval(() => loadAll().catch(console.error), POLL);
setInterval(renderLive, 30000);
window.__sentinel = {setLens, select, openRoute, openBacktest, openTrace};
})();
</script>
</body>
